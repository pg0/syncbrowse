[package]
name = "syncbrowse"
version = "0.1.1"
edition = "2024"

[dependencies]
flashraw = "0.1.1"
form_urlencoded = "1.2.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
jpeg-decoder = "0.3.2"
kamadak-exif = "0.6.1"
png = "0.18.1"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde_json = "1.0.154"
tao = "0.37.2"
tiny_http = "0.12.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wry = "0.57.1"

# decoders are slow unoptimized: keep dependencies fast in test builds too
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
